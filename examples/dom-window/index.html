<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Orbit Study</title>
    <style>
      html, body { margin: 0; background: #101522; color: #edf3fa; font-family: sans-serif; }
      body { padding: 24px 28px; }
      header { position: relative; height: 104px; }
      .eyebrow { margin: 0; color: #5ae0ce; font-size: 12px; font-weight: 700; letter-spacing: 2px; }
      h1 { margin: 8px 0 7px; font-size: 30px; font-weight: 600; }
      #status { margin: 0; color: #aebed0; font-size: 14px; }
      #pause { position: absolute; right: 0; top: 12px; width: 108px; height: 40px; border: 1px solid #5ae0ce; border-radius: 8px; background: #1b2937; color: #e7fff9; font: inherit; font-size: 14px; cursor: pointer; }
      #scene { display: block; margin: 0; border: 0; padding: 0; background: #101522; }
      footer { position: relative; margin-top: 18px; padding-top: 15px; border-top: 1px solid #293849; font-size: 12px; color: #aebed0; }
      #dimensions { position: absolute; right: 0; top: 15px; color: #7692a9; }
    </style>
  </head>
  <body>
    <header>
      <p class="eyebrow">ORBIT STUDY</p>
      <h1>A scene, in motion.</h1>
      <p id="status" role="status">Preparing the scene…</p>
      <button id="pause" type="button" aria-pressed="false">Pause</button>
    </header>
    <canvas id="scene" width="904" height="440" aria-label="A turquoise animated torus knot above a dark floor"></canvas>
    <footer>
      <span>Space · pause &nbsp; R · reset</span>
      <span id="dimensions"></span>
    </footer>
  <script type="module" src="./app.mjs"></script>
  </body>
</html>
