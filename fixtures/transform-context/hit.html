<!doctype html>
<html style="margin:0;pointer-events:none;background:white">
  <head>
    <meta charset="utf-8">
    <title>Transform stacking-context ownership</title>
    <style>
      body { margin:0; width:448px; height:256px; background:transparent; }
      #host { position:relative; z-index:auto; width:192px; height:96px; transform-origin:0 0; }
      #subject { position:relative; z-index:2; width:96px; height:64px; background:#e02030; pointer-events:auto; }
      #peer { position:relative; top:-96px; z-index:1; width:128px; height:80px; background:#2060e0; pointer-events:auto; }
    </style>
  </head>
  <body><div id="host"><div id="subject"></div></div><div id="peer"></div></body>
</html>
