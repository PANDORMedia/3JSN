[package]
name = "threejs-compiled-ui-experiment"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "9d92719b37c801b8b41c81b799a2a474db8b3936", default-features = false, features = ["woff", "custom-widget"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "9d92719b37c801b8b41c81b799a2a474db8b3936", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "9d92719b37c801b8b41c81b799a2a474db8b3936", default-features = false }

[patch.crates-io]
fontique = { path = "../../.cache/web-fonts/fontique" }
parley = { path = "../../.cache/web-fonts/parley" }

[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "../../.cache/dom-canvas/blitz/packages/blitz-dom" }
blitz-html = { path = "../../.cache/dom-canvas/blitz/packages/blitz-html" }
blitz-traits = { path = "../../.cache/dom-canvas/blitz/packages/blitz-traits" }
stylo_taffy = { path = "../../.cache/dom-canvas/blitz/packages/stylo_taffy" }
debug_timer = { path = "../../.cache/dom-canvas/blitz/packages/debug_timer" }
