[package]
name = "threejs-native-webgl-wgpu-probe"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[dependencies]
wgpu = { version = "=29.0.1", default-features = false, features = ["metal", "wgsl", "std"] }
# Match deno_webgpu 0.226's core/types instead of allowing the wrapper to select newer patches.
wgpu-core = { version = "=29.0.1", default-features = false, features = ["metal"] }
wgpu-hal = { version = "=29.0.4", default-features = false, features = ["metal"] }
wgpu-types = { version = "=29.0.1", default-features = false }
objc2 = "=0.6.4"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["MTLDevice", "MTLTexture", "MTLCommandQueue", "MTLEvent"] }
pollster = "=0.4.0"
serde_json = "1"

[build-dependencies]
cc = "=1.4.6"
