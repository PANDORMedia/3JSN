[package]
name = "threejs-native-webgl-runtime"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"

[workspace]

[[test]]
name = "snapshot"
required-features = ["metal-snapshot"]

[features]
metal-snapshot = ["dep:wgpu", "dep:wgpu-core", "dep:wgpu-hal", "dep:wgpu-types", "dep:objc2", "dep:objc2-metal"]

[dependencies]
deno_core = "=0.412.0"
deno_error = "=0.7.1"
glow = "=0.17.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

tokio = { version = "=1.49.0", features = ["rt", "time"] }
wgpu = { version = "=29.0.4", optional = true, default-features = false, features = ["metal", "wgsl", "std"] }
wgpu-core = { version = "=29.0.1", optional = true, default-features = false, features = ["metal"] }
wgpu-hal = { version = "=29.0.4", optional = true, default-features = false, features = ["metal"] }
wgpu-types = { version = "=29.0.1", optional = true, default-features = false }
objc2 = { version = "=0.6.4", optional = true }
objc2-metal = { version = "=0.3.2", optional = true, default-features = false, features = ["MTLDevice", "MTLTexture", "MTLCommandQueue", "MTLResource", "MTLPixelFormat", "MTLCommandBuffer"] }

[build-dependencies]
serde_json = "=1.0.151"
cc = "=1.4.6"
