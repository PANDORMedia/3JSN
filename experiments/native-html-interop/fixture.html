<!doctype html>
<html>
  <head>
    <style>
      html, body { margin: 0; background: transparent; }
      #root {
        position: absolute;
        left: 24px;
        top: 24px;
        width: 120px;
        height: 120px;
        background: rgba(200, 40, 60, 0.5);
      }
      button {
        display: block;
        width: calc(100% - 16px);
        height: 56px;
        margin: 8px;
        padding: 0;
        border: none;
        background: rgb(24, 64, 160);
        color: white;
        font: 24px sans-serif;
        white-space: nowrap;
      }
    </style>
  </head>
  <body><div id="root"><button id="button">Initial</button></div></body>
</html>
