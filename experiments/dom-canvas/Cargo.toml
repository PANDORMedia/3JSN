[package]
name = "threejs-dom-canvas-probe"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "threejs-dom-canvas-probe"
path = "src/main.rs"

[workspace]

[dependencies]
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "9d92719b37c801b8b41c81b799a2a474db8b3936", default-features = false, features = ["woff"] }
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "9d92719b37c801b8b41c81b799a2a474db8b3936", default-features = false }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "9d92719b37c801b8b41c81b799a2a474db8b3936", default-features = false, features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "9d92719b37c801b8b41c81b799a2a474db8b3936", default-features = false }
anyrender_vello = "=0.14.0"
vello = "=0.10.0"
wgpu = { version = "=29.0.4", default-features = false, features = ["metal", "wgsl", "std"] }
wgpu-core = { version = "=29.0.1", default-features = false, features = ["metal"] }
wgpu-hal = { version = "=29.0.4", default-features = false, features = ["metal"] }
wgpu-types = { version = "=29.0.1", default-features = false }
deno_core = "=0.412.0"
deno_error = "=0.7.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
pollster = "=0.4.0"
png = "=0.18.1"
sha2 = "=0.10.9"
deno_webgpu = "=0.226.0"

deno_web = "=0.290.0"
deno_webidl = "=0.259.0"
tokio = { version = "=1.49.0", features = ["rt", "time", "macros"] }
objc2 = "=0.6.4"
objc2-metal = { version = "=0.3.2", default-features = false, features = ["MTLDevice", "MTLCommandQueue", "MTLTexture", "MTLResource", "MTLPixelFormat"] }

anyrender = "=0.13.0"

[patch.crates-io]
deno_webgpu = { path = "../../.cache/dom-canvas/deno_webgpu" }

[patch."https://github.com/DioxusLabs/blitz"]
blitz-dom = { path = "../../.cache/dom-canvas/blitz/packages/blitz-dom" }
blitz-html = { path = "../../.cache/dom-canvas/blitz/packages/blitz-html" }
blitz-paint = { path = "../../.cache/dom-canvas/blitz/packages/blitz-paint" }
blitz-traits = { path = "../../.cache/dom-canvas/blitz/packages/blitz-traits" }
stylo_taffy = { path = "../../.cache/dom-canvas/blitz/packages/stylo_taffy" }
debug_timer = { path = "../../.cache/dom-canvas/blitz/packages/debug_timer" }
