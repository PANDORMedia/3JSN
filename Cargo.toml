[workspace]
members = ["crates/gpu-probe", "crates/runtime", "crates/player"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "MIT"
version = "0.0.0"

[workspace.dependencies]
# Independent device probe only. Match deno_webgpu's wgpu-core versions when
# integrating the JS bridge; resources cannot cross unrelated wgpu instances.
wgpu = { version = "=28.0.0", default-features = false, features = ["std", "metal", "vulkan", "dx12", "wgsl"] }
pollster = "=0.4.0"
deno_core = "=0.412.0"
deno_web = "=0.290.0"
deno_webidl = "=0.259.0"
deno_webgpu = "=0.226.0"
deno_error = "=0.7.1"
raw-window-handle = "=0.6.2"
winit = "=0.30.13"
thiserror = "=2.0.18"
tokio = { version = "=1.49.0", features = ["rt", "time", "sync", "macros"] }
