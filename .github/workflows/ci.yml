name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Select Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.0 fmt --all --check
      - run: cargo +1.93.0 check --workspace --locked
      - run: cargo +1.93.0 clippy --workspace --locked -- -D warnings
      # Native GPU/window tests require separate hardware runners.
