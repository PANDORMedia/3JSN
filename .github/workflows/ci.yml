name: Source checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  source:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Select Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal --component rustfmt --component clippy
      - run: cargo +1.93.0 fmt --all --check
      - run: cargo +1.93.0 check --workspace --locked
      - run: cargo +1.93.0 clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo +1.93.0 test --workspace --locked
      # Native GPU/window tests require separate hardware runners.
